<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iOS input fixture</title>
    <style>
      body { margin: 0; padding: 8px; font: 16px/1.5 system-ui, sans-serif; }
      input, select, textarea { display: block; width: 200px; height: 44px; margin-bottom: 8px; padding: 0 8px; font-size: 14px; }
      #notes { font-size: 16px; }
    </style>
  </head>
  <body>
    <input id="email" type="email" name="email" aria-label="Email" />
    <select id="country" name="country" aria-label="Country">
      <option>UK</option>
    </select>
    <textarea id="notes" name="notes" aria-label="Notes"></textarea>
  </body>
</html>
