<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixed wide fixture</title>
    <style>
      body { margin: 0; overflow-x: hidden; font: 16px/1.5 system-ui, sans-serif; }
      nav { position: fixed; inset: 0 0 auto 0; display: flex; gap: 16px; width: 120%; padding: 12px; background: #222; color: #fff; }
      nav a { color: #fff; }
      main { padding: 80px 16px 16px; }
    </style>
  </head>
  <body>
    <nav>
      <a href="#main">Home</a>
      <a href="#main">About</a>
      <a href="#main">Skills</a>
    </nav>
    <main id="main">Fixed navigation is wider than the viewport.</main>
  </body>
</html>
