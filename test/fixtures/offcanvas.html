<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Off canvas fixture</title>
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
      .wrap { position: relative; width: 100%; height: 40px; overflow: hidden; }
      .off-right { position: absolute; top: 0; left: 0; width: 600px; height: 40px; background: #ddd; transform: translateX(100%); }
      .off-left { position: absolute; top: 60px; left: -9999px; width: 300px; height: 20px; background: #ccc; }
      .off-right a, .off-left a { display: block; width: 20px; height: 20px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="off-right"><a href="#off">x</a></div>
    </div>
    <div class="off-left"><a href="#off">x</a></div>
  </body>
</html>
