<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixed overlay fixture</title>
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
      .cookie { position: fixed; left: 0; right: 0; bottom: 0; height: 400px; padding: 16px; background: #111; color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Fixed overlay</h1>
      <p>This page has a fixed panel covering half the viewport.</p>
    </main>
    <div class="cookie">A deliberately oversized fixed panel.</div>
  </body>
</html>
