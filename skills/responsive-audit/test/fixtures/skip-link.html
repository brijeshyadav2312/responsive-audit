<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skip link fixture</title>
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
      .skip { position: absolute; left: 8px; top: -100px; width: 20px; height: 20px; background: #000; color: #fff; }
      main { padding: 16px; }
      button { width: 48px; height: 48px; }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <main id="main"><button type="button">Go</button></main>
  </body>
</html>
