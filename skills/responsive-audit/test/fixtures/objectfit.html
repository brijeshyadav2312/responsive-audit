<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Object fit fixture</title>
    <style>
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
      img { display: block; width: 300px; height: 300px; margin-bottom: 8px; }
      #cover { object-fit: cover; }
      #contain { object-fit: contain; }
      #fill { object-fit: fill; }
    </style>
  </head>
  <body>
    <img id="cover" alt="Cover" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='800'%20height='400'%3E%3Crect%20width='800'%20height='400'%20fill='%236366f1'/%3E%3C/svg%3E" />
    <img id="contain" alt="Contain" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='800'%20height='400'%3E%3Crect%20width='800'%20height='400'%20fill='%236366f1'/%3E%3C/svg%3E" />
    <img id="fill" alt="Fill" src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='800'%20height='400'%3E%3Crect%20width='800'%20height='400'%20fill='%236366f1'/%3E%3C/svg%3E" />
  </body>
</html>
