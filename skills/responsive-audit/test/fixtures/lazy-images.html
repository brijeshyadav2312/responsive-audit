<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lazy image wait fixture</title>
    <style>
      body {
        margin: 0;
        font: 16px sans-serif;
      }
      .spacer {
        height: 5000px;
      }
      img {
        display: block;
        width: 40px;
        height: 40px;
      }
    </style>
  </head>
  <body>
    <img
      id="visible"
      alt=""
      src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='40'%20height='40'%3E%3Crect%20width='40'%20height='40'%20fill='%233b82f6'/%3E%3C/svg%3E"
    />
    <img id="hidden" alt="" loading="lazy" src="slow.png" style="display: none" />
    <div class="spacer"></div>
    <img id="lazy" alt="" loading="lazy" src="slow.png" />
  </body>
</html>
